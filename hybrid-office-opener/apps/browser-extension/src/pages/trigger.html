<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hybrid Office Opener</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .container { text-align: center; padding: 40px; }
    .spinner {
      border: 5px solid rgba(255,255,255,0.3); width: 48px; height: 48px;
      border-radius: 50%; border-top-color: #fff;
      animation: spin 0.8s linear infinite; margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 22px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; opacity: 0.85; }
    .status { margin-top: 20px; font-size: 13px; opacity: 0.7; word-break: break-all; max-width: 500px; }
    .error { color: #ffcdd2; font-weight: bold; opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h2>Đang mở tài liệu...</h2>
    <p>Vui lòng chờ trong giây lát.</p>
    <div class="status" id="status"></div>
  </div>
  <script src="trigger.js"></script>
</body>
</html>
